<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedrez HTML5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }
        
        h1 {
            margin-bottom: 10px;
        }
        
        #game-info {
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #34495e;
        }
        
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
        }
        
        .white {
            background-color: #f0d9b5;
            color: black;
        }
        
        .black {
            background-color: #b58863;
            color: black;
        }
        
        .selected {
            background-color: #7fff00 !important;
        }
        
        .valid-move {
            background-color: #90EE90 !important;
        }
        
        #controls {
            margin-top: 20px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>♔ Ajedrez HTML5 ♚</h1>
    <div id="game-info">Turno: <span id="current-turn">Blancas</span></div>
    <div id="board"></div>
    <div id="controls">
        <button onclick="resetGame()">Nueva Partida</button>
    </div>

    <script>
        const board = document.getElementById('board');
        const currentTurnSpan = document.getElementById('current-turn');
        
        let selectedSquare = null;
        let currentPlayer = 'white';
        let gameBoard = [];
        
        const pieces = {
            white: {
                king: '♔', queen: '♕', rook: '♖', bishop: '♗', knight: '♘', pawn: '♙'
            },
            black: {
                king: '♚', queen: '♛', rook: '♜', bishop: '♝', knight: '♞', pawn: '♟'
            }
        };
        
        function initBoard() {
            gameBoard = [
                ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
                ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
                ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
            ];
        }
        
        function getPieceSymbol(piece) {
            if (!piece) return '';
            const isWhite = piece === piece.toUpperCase();
            const type = piece.toLowerCase();
            const color = isWhite ? 'white' : 'black';
            
            switch(type) {
                case 'k': return pieces[color].king;
                case 'q': return pieces[color].queen;
                case 'r': return pieces[color].rook;
                case 'b': return pieces[color].bishop;
                case 'n': return pieces[color].knight;
                case 'p': return pieces[color].pawn;
                default: return '';
            }
        }
        
        function renderBoard() {
            board.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;
                    
                    const piece = gameBoard[row][col];
                    square.textContent = getPieceSymbol(piece);
                    
                    if (selectedSquare && selectedSquare.row === row && selectedSquare.col === col) {
                        square.classList.add('selected');
                    }
                    
                    square.addEventListener('click', () => handleSquareClick(row, col));
                    board.appendChild(square);
                }
            }
        }
        
        function isValidMove(fromRow, fromCol, toRow, toCol, piece) {
            const targetPiece = gameBoard[toRow][toCol];
            const isWhite = piece === piece.toUpperCase();
            
            // No puedes capturar tus propias piezas
            if (targetPiece) {
                const isTargetWhite = targetPiece === targetPiece.toUpperCase();
                if (isWhite === isTargetWhite) return false;
            }
            
            const pieceType = piece.toLowerCase();
            const rowDiff = Math.abs(toRow - fromRow);
            const colDiff = Math.abs(toCol - fromCol);
            
            switch(pieceType) {
                case 'p': // Peón
                    const direction = isWhite ? -1 : 1;
                    const startRow = isWhite ? 6 : 1;
                    
                    // Movimiento hacia adelante
                    if (fromCol === toCol && !targetPiece) {
                        if (toRow === fromRow + direction) return true;
                        if (fromRow === startRow && toRow === fromRow + 2 * direction && !gameBoard[fromRow + direction][fromCol]) return true;
                    }
                    // Captura diagonal
                    if (colDiff === 1 && toRow === fromRow + direction && targetPiece) return true;
                    return false;
                    
                case 'r': // Torre
                    if (fromRow !== toRow && fromCol !== toCol) return false;
                    return isPathClear(fromRow, fromCol, toRow, toCol);
                    
                case 'n': // Caballo
                    return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);
                    
                case 'b': // Alfil
                    if (rowDiff !== colDiff) return false;
                    return isPathClear(fromRow, fromCol, toRow, toCol);
                    
                case 'q': // Reina
                    if (fromRow !== toRow && fromCol !== toCol && rowDiff !== colDiff) return false;
                    return isPathClear(fromRow, fromCol, toRow, toCol);
                    
                case 'k': // Rey
                    return rowDiff <= 1 && colDiff <= 1;
                    
                default:
                    return false;
            }
        }
        
        function isPathClear(fromRow, fromCol, toRow, toCol) {
            const rowStep = toRow > fromRow ? 1 : (toRow < fromRow ? -1 : 0);
            const colStep = toCol > fromCol ? 1 : (toCol < fromCol ? -1 : 0);
            
            let currentRow = fromRow + rowStep;
            let currentCol = fromCol + colStep;
            
            while (currentRow !== toRow || currentCol !== toCol) {
                if (gameBoard[currentRow][currentCol]) return false;
                currentRow += rowStep;
                currentCol += colStep;
            }
            
            return true;
        }
        
        function handleSquareClick(row, col) {
            const clickedPiece = gameBoard[row][col];
            const isWhitePiece = clickedPiece && clickedPiece === clickedPiece.toUpperCase();
            const isBlackPiece = clickedPiece && clickedPiece === clickedPiece.toLowerCase();
            const isCurrentPlayerPiece = (currentPlayer === 'white' && isWhitePiece) || (currentPlayer === 'black' && isBlackPiece);
            
            if (selectedSquare) {
                const fromRow = selectedSquare.row;
                const fromCol = selectedSquare.col;
                const piece = gameBoard[fromRow][fromCol];
                
                if (isValidMove(fromRow, fromCol, row, col, piece)) {
                    // Realizar movimiento
                    gameBoard[row][col] = piece;
                    gameBoard[fromRow][fromCol] = '';
                    
                    // Cambio de turno
                    currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
                    currentTurnSpan.textContent = currentPlayer === 'white' ? 'Blancas' : 'Negras';
                    
                    selectedSquare = null;
                    renderBoard();
                    return;
                }
            }
            
            // Seleccionar pieza
            if (isCurrentPlayerPiece) {
                selectedSquare = { row, col };
                renderBoard();
            } else {
                selectedSquare = null;
                renderBoard();
            }
        }
        
        function resetGame() {
            initBoard();
            selectedSquare = null;
            currentPlayer = 'white';
            currentTurnSpan.textContent = 'Blancas';
            renderBoard();
        }
        
        // Iniciar juego
        initBoard();
        renderBoard();
    </script>
</body>
</html>
